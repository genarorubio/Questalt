<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="appTitle">QuestATL.com - Interactive City Scavenger Hunts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes floatAnim {
            0% { transform: translateX(-20px); }
            50% { transform: translateX(20px); }
            100% { transform: translateX(-20px); }
        }
        .theme-anim { animation: floatAnim 6s ease-in-out infinite; display: inline-block; }
    </style>
</head>
<body id="appBody" class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Top Dynamic Banner / Header -->
    <header id="appHeader" class="p-4 shadow-md flex justify-between items-center transition-colors duration-500" style="background-color: #0f172a; border-bottom: 2px solid #d97706;">
        <div class="flex items-center space-x-3">
            <span id="themeEmoji" class="text-3xl theme-anim">🔍</span>
            <div>
                <h1 id="headerTitleText" class="text-xl font-black tracking-wider uppercase text-amber-500">QuestATL.com</h1>
                <p id="headerSubtitle" class="text-xs text-slate-400">Database-Driven Adventure Engine</p>
            </div>
        </div>
        <div id="adminBadge" class="hidden text-xs bg-amber-500 text-slate-900 font-bold px-2 py-1 rounded">ADMIN MODE</div>
    </header>

    <!-- Announcement Banner (Controlled via Config Tab) -->
    <div id="announcementBanner" class="hidden bg-amber-600 text-slate-950 font-bold text-center py-2 px-4 text-sm"></div>

    <!-- Main Container -->
    <main class="flex-1 max-w-2xl w-full mx-auto p-4 flex flex-col justify-center">
        <div id="appRoot" class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl text-center">
            <h2 class="text-2xl font-bold mb-4 text-amber-400">Loading QuestATL...</h2>
            <p class="text-slate-400">Syncing live database and active themes...</p>
        </div>
    </main>

    <!-- Footer / Suggestion Box Link -->
    <footer class="p-4 text-center text-xs text-slate-500 border-t border-slate-800">
        &copy; 2026 QuestATL.com &bull; Powered by Google Sheets &bull; <a href="mailto:genaro.genarios@gmail.com" class="text-amber-500 underline">Send Feedback</a>
    </footer>

    <script>
        // --- MASTER CONFIGURATION & FALLBACKS ---
        const GOOGLE_SHEET_API_URL = "https://script.google.com/macros/s/AKfycbwYyY71tA_i6K1q8vF7Z5p8VwW5KqY8vF7Z5p8VwW5KqY8vF7Z5p8VwW5/exec"; // Replace with your live web app URL if needed
        
        let GLOBAL_CONFIG = { hintPenalty: 120, announcement: "" };
        let ACTIVE_THEME = { primaryColor: "#0f172a", accentColor: "#d97706", bgColor: "#1e293b", title: "QuestATL.com", emoji: "🔍" };
        let CITIES_DATABASE = [
            { id: "lawrenceville", name: "Lawrenceville", state: "GA", status: "LIVE", lat: 33.95615, lng: -83.98899 }
        ];
        
        // Instant Fallback Lawrenceville Clues in case offline
        let DEFAULT_LAWRENCEVILLE_CLUES = [
            { cityId: "lawrenceville", number: 1, shortLabel: "Alma / Fountain", title: "Stop #1 - The Brewing Fountain", riddle: "Find the fountain by where a drink is brew. Give us it's name for the next clue", acceptedAnswers: ["seven sisters fountain", "seven sisters", "7 sisters fountain"], hint: "Check the fountain courtyard right near the brewery and Alma Mexicana off the Square.", lat: 33.9561566, lng: -83.9889916, mapX: 22, mapY: 38, sponsorName: "Alma Mexicana", sponsorPerk: "Free Chips & Salsa (or Queso dip) with any 2 Tacos or Entree" },
            { cityId: "lawrenceville", number: 2, shortLabel: "Liberty Books", title: "Stop #2 - Freedom's Post", riddle: "Pages turn, the freedom to save, the post in front of me will give you the numbers you crave.", acceptedAnswers: ["3117"], hint: "Head to Liberty Books on Croghan St and inspect the post right in front of the bookstore.", lat: 33.95625, lng: -83.98849, mapX: 37, mapY: 33, sponsorName: "Liberty Books", sponsorPerk: "15% OFF any single book or Blind-Date-With-A-Book item" },
            { cityId: "lawrenceville", number: 3, shortLabel: "Vintages", title: "Stop #3 - Shrek's Friend", riddle: "Find Shrek's best friend. He has an electric feel to him. What is his name?", acceptedAnswers: ["tipsy mule", "the tipsy mule"], hint: "Check outside Vintages for a familiar four-legged friend.", lat: 33.95634, lng: -83.98729, mapX: 63, mapY: 30, sponsorName: "Vintages A Tasting Room", sponsorPerk: "$3 OFF any Wine Tasting Flight or Draft Pour" },
            { cityId: "lawrenceville", number: 4, shortLabel: "Boulder Creek", title: "Stop #4 - The Hobbit Hole", riddle: "Find the hobbit hole, where knowledge is given. On the other side a mountain is found. What mountain is it?", acceptedAnswers: ["the lonely mountain", "lonely mountain"], hint: "Check the Little Free Library box outside Boulder Creek Coffee and look on the other side for the mountain's name.", lat: 33.9563309, lng: -83.9870433, mapX: 78, mapY: 34, sponsorName: "Boulder Creek Coffee", sponsorPerk: "$1.50 OFF any Specialty Iced Latte or Pastry bundle" },
            { cityId: "lawrenceville", number: 5, shortLabel: "Dog Park", title: "Stop #5 - The Local Hero", riddle: "A plaque commemorating a local hero can be found between these two gated parks. What is the hero's name?", acceptedAnswers: ["hyro", "k-9 hyro", "k9 hyro", "officer hyro"], hint: "Walk down toward the dog parks at the Lawn and inspect the memorial plaque between the gates.", lat: 33.95480, lng: -83.98623, mapX: 80, mapY: 64, sponsorName: null, sponsorPerk: null },
            { cityId: "lawrenceville", number: 6, shortLabel: "Picnic Table", title: "Stop #6 - Lucky Charm Table", riddle: "Make a wish, lucky charm, by a flag, on the table a name you will find. What is that name?", acceptedAnswers: ["juleah everglade", "juleah"], hint: "Look for the bright yellow and green painted picnic table at the corner of the park near the flag.", lat: 33.95429, lng: -83.98592, mapX: 85, mapY: 82, sponsorName: null, sponsorPerk: null },
            { cityId: "lawrenceville", number: 7, shortLabel: "Playground", title: "Stop #7 - The Park Creature", riddle: "At the park you'll find me. The only creature in sight. By the jungle and a playhouse. How many red lines in my body do you see?", acceptedAnswers: ["13", "thirteen"], hint: "Find the caterpillar on the playground by the playhouse and carefully count every red stripe/line along its body.", lat: 33.9542582, lng: -83.9879448, mapX: 48, mapY: 85, sponsorName: null, sponsorPerk: null },
            { cityId: "lawrenceville", number: 8, shortLabel: "Clover Display", title: "Stop #8 - Field of Clovers", riddle: "In this field of clovers, your luck is not over! All around me history has been made. The number of leaves will give you the answer you seek.", acceptedAnswers: ["37", "thirty seven", "thirty-seven"], hint: "Count the total number of individual clover leaves on the clover art display.", lat: 33.9546875, lng: -83.9888125, mapX: 24, mapY: 72, sponsorName: null, sponsorPerk: null },
            { cityId: "lawrenceville", number: 9, shortLabel: "Courthouse", title: "Stop #9 - The Native Son", riddle: "A gentleman, a sportsman, a champion of the world. This tribute commemorates this Lawrenceville native son. What is his name?", acceptedAnswers: ["ezzard charles", "the cincinnati cobra"], hint: "Head back up to the Historic Courthouse lawn and check the tribute monument.", lat: 33.95714, lng: -83.98931, mapX: 20, mapY: 14, sponsorName: null, sponsorPerk: null }
        ];

        let activeCityId = "lawrenceville";
        let clues = DEFAULT_LAWRENCEVILLE_CLUES;

        // --- FETCH MASTER DATA FROM GOOGLE SHEETS ---
        function initializeAppFromSheet() {
            if (!GOOGLE_SHEET_API_URL) {
                renderLandingPage();
                return;
            }

            fetch(GOOGLE_SHEET_API_URL + "?t=" + new Date().getTime())
                .then(res => res.json())
                .then(data => {
                    if (data && data.status === "ok") {
                        // 1. Process Config
                        if (data.config) {
                            // Map config rows if provided
                        }

                        // 2. Process Monthly Themes & Animations based on current month
                        const currentMonth = new Date().getMonth() + 1; // 1-12
                        if (data.themes && data.themes.length > 0) {
                            const matchedTheme = data.themes.find(t => {
                                const months = String(t.activeMonths || "").split(",").map(m => parseInt(m.trim()));
                                return months.includes(currentMonth);
                            }) || data.themes.find(t => t.themeId === "default");

                            if (matchedTheme) {
                                ACTIVE_THEME = {
                                    primaryColor: matchedTheme.primaryColor || "#0f172a",
                                    accentColor: matchedTheme.accentColor || "#d97706",
                                    bgColor: matchedTheme.bgColor || "#1e293b",
                                    title: matchedTheme.headerTitle || "QuestATL.com",
                                    emoji: matchedTheme.animationIcon || "🔍"
                                };
                            }
                        }

                        // 3. Process Cities
                        if (data.cities && data.cities.length > 0) {
                            CITIES_DATABASE = data.cities;
                        }

                        // 4. Process Clues
                        if (data.clues && data.clues.length > 0) {
                            window.MASTER_SHEET_CLUES = data.clues;
                            // Unlock cities in database if they have clues
                            CITIES_DATABASE.forEach(city => {
                                const hasClues = data.clues.some(c => c.cityId === city.id);
                                if (hasClues) city.status = "LIVE";
                            });

                            const cityClues = data.clues.filter(c => c.cityId === activeCityId);
                            if (cityClues.length > 0) {
                                clues = cityClues;
                            }
                        }
                    }
                    applyThemeToUI();
                    renderLandingPage();
                })
                .catch(err => {
                    console.warn("Using offline fallback data:", err);
                    applyThemeToUI();
                    renderLandingPage();
                });
        }

        function applyThemeToUI() {
            document.getElementById("appHeader").style.backgroundColor = ACTIVE_THEME.primaryColor;
            document.getElementById("headerTitleText").innerText = ACTIVE_THEME.title;
            document.getElementById("themeEmoji").innerText = ACTIVE_THEME.emoji;
            document.getElementById("appBody").style.backgroundColor = ACTIVE_THEME.bgColor;
        }

        function renderLandingPage() {
            const root = document.getElementById("appRoot");
            let citiesHtml = CITIES_DATABASE.map(city => `
                <div class="bg-slate-700/50 border border-slate-600 rounded-lg p-4 mb-3 flex justify-between items-center">
                    <div class="text-left">
                        <h3 class="font-bold text-lg text-amber-400">${city.name}, ${city.state}</h3>
                        <p class="text-xs text-slate-400">${city.status === "LIVE" ? clues.length + " Stops Available" : "Coming Soon"}</p>
                    </div>
                    ${city.status === "LIVE" ? 
                        `<button onclick="startHunt('${city.id}')" class="bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold px-4 py-2 rounded shadow">Start Quest</button>` : 
                        `<span class="text-xs bg-slate-800 text-slate-400 px-3 py-1 rounded">SOON</span>`}
                </div>
            `).join("");

            root.innerHTML = `
                <h2 class="text-2xl font-black mb-2 text-amber-400">Choose Your City</h2>
                <p class="text-sm text-slate-300 mb-6">Select a live destination to begin your interactive scavenger hunt adventure.</p>
                <div class="space-y-2 mb-6">${citiesHtml}</div>
                <div class="text-xs text-slate-400 border-t border-slate-700 pt-4">
                    Are you a local business owner? <a href="mailto:genaro.genarios@gmail.com" class="text-amber-400 underline">Partner with us</a>
                </div>
            `;
        }

        function startHunt(cityId) {
            activeCityId = cityId;
            if (window.MASTER_SHEET_CLUES) {
                clues = window.MASTER_SHEET_CLUES.filter(c => c.cityId === cityId);
            }
            const root = document.getElementById("appRoot");
            root.innerHTML = `
                <h2 class="text-2xl font-bold mb-3 text-amber-400">Quest Started: ${cityId.toUpperCase()}</h2>
                <p class="text-slate-300 mb-6">You are ready to navigate the trail. First stop: <strong>${clues[0]?.title || "Stop 1"}</strong></p>
                <p class="text-xs text-amber-500 mb-4">📍 Tap below to view your interactive map and riddles!</p>
                <button onclick="renderLandingPage()" class="bg-slate-700 hover:bg-slate-600 text-white font-bold px-4 py-2 rounded">Back to Cities</button>
            `;
        }

        // Initialize App on Load
        window.onload = function() {
            initializeAppFromSheet();
        };
    </script>
</body>
</html>
